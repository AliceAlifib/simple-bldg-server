name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
      ref:
        description: 'Git ref (branch, tag, or SHA) to deploy. Defaults to master.'
        required: false
        default: 'master'

jobs:
  deploy-dev:
    name: Deploy to dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to bldg-server-dev
        run: flyctl deploy --remote-only -c bldg_server/fly.dev.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

  deploy-prod:
    name: Deploy to prod
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to bldg-server
        run: flyctl deploy --remote-only -c bldg_server/fly.prod.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
