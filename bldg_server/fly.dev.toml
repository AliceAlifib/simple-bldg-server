# Dev/staging Fly.io config. Deploys to the existing `bldg-server` app in the
# `personal` Fly org (which now serves as the dev environment).
#
# Deploy with: fly deploy -c bldg_server/fly.dev.toml
#
# REQUIRED secrets (set via `fly secrets set -a bldg-server ...`; the app fails
# loud at boot if any signing secret is missing — see config/runtime.exs):
#   DB_USER, DB_PASSWORD          database credentials
#   REDIS_PWD                     Upstash password
#   SENDGRID_API_KEY              magic-link email delivery
#   SECRET_KEY_BASE               Phoenix signing base  (openssl rand -base64 64)
#   MAGIC_LINK_SALT               magic-link token salt (openssl rand -hex 32)
#   AUTH_TOKEN_SALT               bearer-token salt     (openssl rand -hex 32)
#
# OPTIONAL secrets/vars (safe defaults when unset):
#   ENFORCE_AUTH                  "true" turns auth enforcement ON. LEAVE UNSET
#                                 for the dual-run rollout (auth inert). Flip to
#                                 "true" only after clients send tokens.
#   BATTERY_PROVISION_TOKEN       gate for provisioning battery API keys
#   CORS_ORIGINS                  comma-separated browser origins (prod denies
#                                 cross-origin by default)
#   BATTERY_URL_ALLOWED_HOSTS     SSRF allow-list for battery callback hosts
#   SENTRY_DSN                    error reporting
#
# The secrets in the original fly.toml on master are considered compromised —
# rotate SendGrid, Upstash, the DB password, and SECRET_KEY_BASE.

app = 'bldg-server'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'bldg-server.fly.dev'
  PORT = '8080'
  APP_HOSTNAME = 'bldg-server.fly.dev'
  APP_PORT = '8080'
  DB_HOST = 'bldg-server-db.internal'
  DB_NAME = 'bldg_server'
  DB_PORT = '5433'
  DB_SSL = 'false'
  REDIS_HOST = 'fly-alicein-redis.upstash.io'
  REDIS_PORT = 6379
  DGRAPH_URL = 'https://dgraph-db.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
